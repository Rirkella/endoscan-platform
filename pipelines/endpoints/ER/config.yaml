# ER endpoint pipeline config — committed default (intentionally BLOCKED).
#
# Uses the fixture adapter, the STRICT real quality gate, and approved: false, so
# running it on fixtures is blocked (the tiny fixture set fails the strict gate
# and no human has approved). For a reviewed ER run on staged data, copy
# config.real.example.yaml, point it at staged extracts, confirm floors, and have
# a human set approved: true only after reviewing the gate verdict + dataset card.

endpoint_id: ER
biological_target: Estrogen Receptor
version: "0.1.0"
claim_scope: >-
  ER functional modulation (agonist or antagonist transactivation; direction not
  distinguished); not a physical-binding, pan-endocrine, or regulatory/clinical/diagnostic
  claim

data:
  target: ER
  adapter: fixture                 # "fixture" (CI) | "staged" (real, local extracts)
  fixtures_dir: tests/fixtures/datasets
  n_groups: 2
  seed: 0
  required_label_sources: [cerapp]  # ER trains on CERAPP; toxcast/tox21 optional here

gate:
  thresholds_path: registry/data/quality_gates.yaml   # strict, real thresholds

approval:
  approved: false                  # a human must explicitly approve
  approved_by: ""
  note: ""

evaluation:
  mode: nested                     # honest estimate: "nested" | "holdout"
  outer_splits: 5
  inner_splits: 3
  test_size: 0.25                  # held-out mode only

training:
  models:
    - ridge_logreg
    - lasso_logreg
    - elastic_net_logreg
    - random_forest
    - gradient_boosting
  selection_tolerance: 0.02
  validated_mvp_floors:
    auroc: 0.75
    auprc: 0.50
    balanced_accuracy: 0.65
  validated_mvp_ceilings:
    brier_score: 0.20
