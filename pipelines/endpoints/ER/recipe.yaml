# BuildRecipe for the ER RE-BASELINE rebuild through the M5 Builder Agent.
#
# Used ONLY on the server, after the original ER binary + staged matrix became unavailable
# (see docs/runbooks/er_rebaseline.md). The agent loads this, runs the dataset toolchain +
# gate into a workspace, and STOPS at awaiting_approval (gate PASS) or failed_qc (gate FAIL);
# training/registration happen only through the guarded promote() after explicit human
# approval. A BuildRecipe forbids extra keys, so it cannot smuggle a (lowered) threshold —
# floors come ONLY from the referenced config + registry/data/quality_gates.yaml.
#
# pipeline_runner_path reuses the GENERIC ER runner (run_pipeline is target-agnostic; the
# agent never edits it). pipeline_config_path is the concrete STAGED real config (adapter=
# staged, approved=false); the server must first stage data/staged/er/lincs.parquet (the
# CERAPP-labelled MCF7/A549 slice re-extracted from the real gctx via Route B — the proven
# staging/stage_er.build_lincs_parquet path).
#
# IMPORTANT — ER is frozen:true. promote() will raise FrozenEndpointError until ER is
# DELIBERATELY un-frozen in a reviewed registry edit (the integrity checkpoint, done in the
# rebuild PR, not here). This recipe PR does NOT un-freeze ER and does NOT run the build.
name: er_rebaseline
pipeline_runner_path: pipelines/endpoints/ER/run.py
pipeline_config_path: pipelines/endpoints/ER/config.real.yaml
