# ER endpoint pipeline config — reviewed real-data run template. Copy this; do not
# commit a filled-in real config with approved: true until the run is reviewed.
#
# An authorized reproduction is run by a maintainer with separately reviewed source
# artifacts. Stage the real extracts under data/staged/er/ as described in
# pipelines/README.md, then set approved: true only in an untracked working copy after
# reviewing the gate verdict and dataset card. No regulatory-grade claim is implied.

endpoint_id: ER
biological_target: Estrogen Receptor
version: "0.1.0"
claim_scope: >-
  ER functional modulation (agonist or antagonist transactivation; direction not
  distinguished); not a physical-binding, pan-endocrine, or regulatory/clinical/diagnostic
  claim

data:
  target: ER
  adapter: staged                  # reads local Parquet/CSV extracts (no downloads)
  staged_dir: data/staged/er
  n_groups: 10                     # compound groups for the split plan
  seed: 0
  required_label_sources: [cerapp]  # CERAPP required; toxcast/tox21 optional (absent -> 0 rows)

gate:
  thresholds_path: registry/data/quality_gates.yaml   # strict, real thresholds

approval:
  approved: false                  # set true by a human AFTER reviewing the gate + card
  approved_by: ""
  note: ""

evaluation:
  mode: nested                     # nested grouped CV (honest estimate); "holdout" if N large
  outer_splits: 5
  inner_splits: 3
  test_size: 0.25

training:
  models:
    - ridge_logreg
    - lasso_logreg
    - elastic_net_logreg
    - random_forest
    - gradient_boosting
  selection_tolerance: 0.02
  # Starting values — finalize against positive prevalence before real-data execution.
  # AUPRC floor should be sized to prevalence (random-baseline AUPRC = prevalence).
  validated_mvp_floors:
    auroc: 0.75
    auprc: 0.50
    balanced_accuracy: 0.65
  validated_mvp_ceilings:
    brier_score: 0.20
