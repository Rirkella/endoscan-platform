# EndoScan thin serving API — a read-only FastAPI over endoscan_core.

[project]
name = "endoscan-api"
version = "0.0.0"
description = "EndoScan thin read-only serving API (FastAPI over endoscan_core)."
requires-python = ">=3.11"
dependencies = [
    "endoscan-core",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Required for multipart/form-data signature uploads.
    "python-multipart>=0.0.9",
    # API-side enrichment statistics.
    "scipy>=1.11",
    # ER declares TreeSHAP support, so this is a serving-runtime dependency.
    "shap>=0.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["endoscan_api"]

[tool.uv.sources]
endoscan-core = { workspace = true }
