# EndoScan thin serving API — a READ-ONLY FastAPI over endoscan_core.
#
# This service holds NO science. Every route is a thin wrapper over a tested
# endoscan_core function (registry.store + inference). It is a uv workspace member
# and depends on endoscan-core via the workspace source.

[project]
name = "endoscan-api"
version = "0.0.0"
description = "EndoScan thin read-only serving API (FastAPI over endoscan_core)."
requires-python = ">=3.11"
dependencies = [
    "endoscan-core",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Required by FastAPI to parse multipart/form-data uploads (POST /signatures/parse).
    "python-multipart>=0.0.9",
    # Standard ORA statistics for POST /interpret/pathways (hypergeometric tail; BH is local).
    # API-side only — no statistics live in endoscan_core. Present transitively via sklearn too.
    "scipy>=1.11",
]

# Explainability EXTRA — mirrors endoscan-core[explain]. TreeSHAP is only needed by
# POST /explain (endoscan_core.inference.explain imports shap lazily). Without it the
# service still serves /predict; /explain returns a clean 503.
[project.optional-dependencies]
explain = ["shap>=0.44"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["endoscan_api"]

[tool.uv.sources]
endoscan-core = { workspace = true }
