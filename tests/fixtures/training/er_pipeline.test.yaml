# TEST-ONLY ER pipeline config: relaxed gate + approved=true so the train path
# runs on fixtures. The committed pipelines/endpoints/ER/config.yaml stays strict
# + unapproved. fixtures_dir points at the training-only weak-signal dataset so
# the result is deterministically `experimental`.

endpoint_id: ER
biological_target: Estrogen Receptor
version: "0.1.0"

data:
  target: ER
  adapter: fixture
  fixtures_dir: tests/fixtures/training/datasets
  n_groups: 2
  seed: 0

gate:
  thresholds_path: tests/fixtures/training/quality_gates_relaxed.yaml

approval:
  approved: true
  approved_by: test-suite
  note: "offline fixture run (path A)"

cv:
  n_splits: 5

training:
  models:
    - elastic_net_logreg
    - gradient_boosting
  selection_metric: auroc
  validated_mvp_floors:
    auroc: 0.75
