# EndoScan core science library.
#
# This package holds framework-free, independently tested domain and scientific logic.
# FastAPI and durable workflows consume it without reimplementing that logic.

[project]
name = "endoscan-core"
version = "0.0.0"
description = "EndoScan core science library (framework-free, transcriptomics-first)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.1",
    "pyyaml>=6",
    "scikit-learn>=1.8",
    "pyarrow>=15",
]

# Inference/explainability EXTRA — NOT a core dependency. ``shap`` (TreeSHAP) is only
# needed by endoscan_core.inference.explain; core imports cleanly without it (the shap
# import is lazy, inside the explain functions). Install: pip install 'endoscan-core[explain]'.
[project.optional-dependencies]
explain = ["shap>=0.44"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["endoscan_core"]
