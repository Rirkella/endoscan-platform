# EndoScan endpoint config (TEMPLATE).
#
# Consumed by later config-driven pipeline runners (e.g. pipelines/endpoints/ER/).
# This is a template with {{ placeholders }} — fill in per endpoint.

endpoint_id: "{{ endpoint_id }}"
biological_target: "{{ biological_target }}"
input_type: "transcriptomics"   # EndoScan is transcriptomics-first; do not change.
version: "{{ version }}"

# Opaque serving-registry provenance tags. Typed source contracts are validated
# against the sources.yaml allow-list before publication.
source_refs: []
