[project]
name = "endoscan-workflows"
version = "0.0.0"
description = "Durable, human-governed workflow and bounded agent foundation for EndoScan."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "endoscan-core",
    "endoscan-jobs",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "openai-agents==0.18.2",
    "pydantic>=2.6",
    "sqlalchemy>=2.0,<3",
]

[tool.uv.sources]
endoscan-core = { workspace = true }
endoscan-jobs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["endoscan_workflows"]
