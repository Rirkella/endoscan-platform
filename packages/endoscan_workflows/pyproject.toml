[project]
name = "endoscan-workflows"
version = "0.0.0"
description = "Durable, human-governed workflow and bounded agent foundation for EndoScan."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "openai-agents==0.18.2",
    "pydantic>=2.6",
    "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["endoscan_workflows"]
