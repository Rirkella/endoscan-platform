# Web frontend CI — typecheck + unit/component tests + production build for apps/web.
# Separate from the Python `CI` (lint-and-test) and `docker` workflows so each stays focused;
# this job runs only when the web app (or this workflow) changes.
name: web

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + component tests
        run: npm test

      - name: Production build
        run: npm run build
