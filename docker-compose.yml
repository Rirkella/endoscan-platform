# EndoScan heavy-job runner image. The API and Vite application are run with
# the cross-platform commands documented in docs/DEVELOPMENT.md; this Compose
# file intentionally does not pretend that deployment images for those
# services exist yet.
services:
  jobs:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--help"]
    volumes:
      - ./.endoscan-data:/data
    environment:
      ENDOSCAN_DATA_ROOT: /data
    profiles: ["jobs"]
