# EndoScan — uv workspace root.
#
# This file is a PURE WORKSPACE ORCHESTRATOR. It is intentionally NOT a
# distributable package (no [project] table). The science library lives in
# packages/endoscan_core and is installed editable as a workspace member.
#
# Tooling config (ruff, pytest, mypy) is centralized here so every member
# shares one source of truth. Dependency management is via `uv`.

[tool.uv.workspace]
members = ["packages/*"]

# Dev tooling (installed by `uv sync`; uv installs the `dev` group by default).
[dependency-groups]
dev = [
    "ruff>=0.8,<0.9",
    "pytest>=8.0",
    "pre-commit>=3.7",
    "mypy>=1.10",
    "dvc>=3.50",
    # Staging-layer / CI helper only (NOT an endoscan_core runtime dependency):
    # the gctx slicer + its synthetic-gctx test use h5py (NumPy-2 compatible).
    "h5py>=3.11",
    # Notebook structural test (tests/staging/test_notebook_structure.py) parses the
    # operator .ipynb with nbformat. CI-only; not an endoscan_core runtime dependency.
    "nbformat>=5.10",
    # TreeSHAP for the M4 inference/explainability tests; installed in CI so the explain
    # tests run. NOT an endoscan_core runtime dependency (shap import is lazy in
    # inference/explain.py and explain tests importorskip it).
    "shap>=0.44",
]

# --- Lint + format -----------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
# Notebooks are cloud-run artifacts (Colab), not linted production code.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["endoscan_core"]

# --- Tests -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "-q"
# Repo root on the path so the top-level `agent` package (not an installed dist) imports.
pythonpath = ["."]

# --- Types (minimal, NON-blocking; CI does not gate on mypy) -----------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
