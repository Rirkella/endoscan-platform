# EndoScan — uv workspace root.
#
# This file is a PURE WORKSPACE ORCHESTRATOR. It is intentionally NOT a
# distributable package (no [project] table). The science library lives in
# packages/endoscan_core and is installed editable as a workspace member.
#
# Tooling config (ruff, pytest, mypy) is centralized here so every member
# shares one source of truth. Dependency management is via `uv`.

[tool.uv.workspace]
members = ["packages/*", "services/*"]

# Dev tooling (installed by `uv sync`; uv installs the `dev` group by default).
[dependency-groups]
dev = [
    "ruff>=0.8,<0.9",
    "pytest>=8.0",
    "pre-commit>=3.7",
    "mypy>=1.10",
    "dvc>=3.50",
    # Starlette/FastAPI TestClient transport for the services/api tests (no network).
    "httpx>=0.27",
    # Staging-layer / CI helper only (NOT an endoscan_core runtime dependency):
    # the gctx slicer + its synthetic-gctx test use h5py (NumPy-2 compatible).
    "h5py>=3.11",
    # TreeSHAP for inference and explainability tests; installed in CI so the explain
    # tests run. NOT an endoscan_core runtime dependency (shap import is lazy in
    # inference/explain.py and explain tests importorskip it).
    "shap>=0.44",
]

# --- Lint + format -----------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
# Local exploratory notebooks are not part of the committed production path.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["endoscan_core", "endoscan_api", "endoscan_workflows"]

# FastAPI's dependency-injection markers are intentionally CALLED in argument defaults
# (the framework's documented pattern); allow them so B008 doesn't flag idiomatic routes.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

# --- Tests -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services"]
addopts = "-q"
# Keep the repository root importable for config-driven pipeline regression tests.
pythonpath = ["."]

# --- Types (bounded production surface; gated by CI) -------------------------
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
